[package]
name = "os-oidc"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-os"
rust-version = "1.91"

[dependencies]
axum = { version = "0.8", features = [
  "tokio",
  "http1",
  "json",
  "form",
  "query",
  "macros",
], default-features = false }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false }
build-time = { version = "0.1", default-features = false }
chrono = { version = "0.4", features = ["serde"], default-features = false }
config = { version = "0.15", features = ["json"], default-features = false }
ed25519-dalek = { version = "2.2", features = [
  "alloc",
  "pkcs8",
  "rand_core",
], default-features = false }
elliptic-curve = { version = "0.13", features = [
  "arithmetic",
  "pkcs8",
  "serde",
], default-features = false }
hashbrown = { version = "0.16", default-features = false, features = [
  "serde",
  "default-hasher",
  "allocator-api2",
] }
form_urlencoded = { version = "1.2", default-features = false }
http = { version = "1.3", default-features = false }
jsonwebtoken = { version = "9.3", features = [
  "use_pem",
], default-features = false }
log = { version = "0.4", default-features = false }
num-bigint = { version = "0.4", features = ["std"], default-features = false }
num-bigint-dig = { version = "0.8", default-features = false }
os-api = { version = "0.1", path = "../api", default-features = false }
os-db = { version = "0.1", path = "../db", default-features = false }
os-model = { version = "0.1", path = "../model", default-features = false }
hex = { version = "0.4", default-features = false }
p256 = { version = "0.13", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
], default-features = false }
p384 = { version = "0.13", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
], default-features = false }
rand = { version = "0.8", features = [
  "std",
  "std_rng",
], default-features = false }
rsa = { version = "0.9", features = ["pem", "serde"], default-features = false }
rust-argon2 = { version = "3.0", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
sqlx = { version = "0.8", features = [
  "uuid",
  "chrono",
  "time",
  "macros",
  "migrate",
  "runtime-tokio-rustls",
  "all-databases",
], default-features = false }
tokio = { version = "1.48", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
], default-features = false }
tokio-util = { version = "0.7", features = ["io"], default-features = false }
tower-http = { version = "0.6", features = [
  "cors",
  "trace",
  "compression-gzip",
], default-features = false }
tracing = { version = "0.1", features = ["std"], default-features = false }
url = { version = "2.5", default-features = false }
utoipa = { version = "5.4", features = [
  "axum_extras",
  "chrono",
  "uuid",
  "macros",
], default-features = false }
utoipa-axum = { version = "0.2", default-features = false }
uuid = { version = "1.18", features = ["serde", "v4"] }
validator = { version = "0.20", features = [
  "derive",
], default-features = false }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "fmt",
  "std",
  "tracing-log",
  "env-filter",
], default-features = false }
dotenvy = "0.15"
scopeguard = "1.2"
tower = "0.5"

[lib]
name = "os_oidc"
