[package]
name = "os-api"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS API Helpers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-api"
rust-version = "1.91"

[dependencies]
axum = { version = "0.8", features = [
  "tokio",
  "http1",
  "json",
  "form",
  "macros",
] }
hashbrown = { version = "0.16", features = ["serde", "default-hasher"] }
http = { version = "1.3" }
log = { version = "0.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1", features = ["std"] }
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "macros"] }
utoipa-axum = { version = "0.2", default-features = false }
validator = { version = "0.20", features = ["derive"] }
config = { version = "0.15" }
url = { version = "2.5", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false }
once_cell = { version = "1.19", default-features = false }
tokio = { version = "1.47", features = ["sync"], default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
build-time = { version = "0.1", default-features = false }
chrono = { version = "0.4", features = [
  "serde",
  "clock",
], default-features = false }

[lib]
name = "os_api"
