[package]
name = "os-api"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS API Helpers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-api"
rust-version = "1.91"

[dependencies]
axum = { version = "0.8", features = [
  "tokio",
  "http1",
  "json",
  "form",
  "macros",
] }
hashbrown = { version = "0.16", features = ["serde", "default-hasher"] }
http = { version = "1.3" }
log = { version = "0.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1", features = ["std"] }
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "macros"] }
validator = { version = "0.20", features = ["derive"] }
config = { version = "0.15" }

[lib]
name = "os_api"
