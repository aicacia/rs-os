[package]
name = "os-oidc-ui"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS UI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-os"
rust-version = "1.90"
default-run = "os-oidc-ui"

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "tokio",
  "http1",
  "json",
  "query",
  "macros",
] }
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
  "help",
] }
clap_complete = { version = "4.5", optional = true, default-features = false }
config = { version = "0.15", default-features = false, features = ["json"] }
dotenvy = { version = "0.15", default-features = false }
log = { version = "0.4", default-features = false }
os-cli = { version = "0.1", path = "../cli", default-features = false }
os-oidc-ui-embed = { version = "0.1", path = "./embed", default-features = false }
tokio = { version = "1.47", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "fmt",
  "std",
  "tracing-log",
  "env-filter",
] }

[features]
completions = ["dep:clap_complete"]
default = ["completions"]

[[bin]]
name = "os-oidc-ui"

[lib]
name = "os_oidc_ui"
