name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          override: true
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run tests
        run: cargo test --all --verbose

  oidc-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Create .env file for os-oidc
        working-directory: apps/oidc
        env:
          PUBLIC_OS_OIDC_API_URL: "http://localhost:3000/oidc/api"
          PUBLIC_URL: "http://localhost:5174/oidc"
          VITE_BASE_PATH: "/oidc"
        run: |
          echo "PUBLIC_OS_OIDC_API_URL=${PUBLIC_OS_OIDC_API_URL}" > .env
          echo "PUBLIC_URL=${PUBLIC_URL}" >> .env
          echo "VITE_BASE_PATH=${VITE_BASE_PATH}" >> .env
      - name: Test os-oidc (build)
        run: pnpm --filter os-oidc build

  oidc-admin-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Create .env file for os-oidc-admin
        working-directory: apps/oidc-admin
        env:
          PUBLIC_OS_OIDC_API_URL: "http://localhost:3000/oidc/api"
          PUBLIC_OS_ADMIN_API_URL: "http://localhost:3000/oidc-admin/api"
          PUBLIC_URL: "http://localhost:5174/oidc-admin"
          VITE_BASE_PATH: "/oidc-admin"
        run: |
          echo "PUBLIC_OS_OIDC_API_URL=${PUBLIC_OS_OIDC_API_URL}" > .env
          echo "PUBLIC_OS_ADMIN_API_URL=${PUBLIC_OS_ADMIN_API_URL}" >> .env
          echo "PUBLIC_URL=${PUBLIC_URL}" >> .env
          echo "VITE_BASE_PATH=${VITE_BASE_PATH}" >> .env
      - name: Test os-oidc-admin (build)
        run: pnpm --filter os-oidc-admin build
