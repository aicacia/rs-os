name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.91"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          override: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node modules (frontend only)
        uses: actions/cache@v3
        with:
          path: crates/oidc-ui/frontend/node_modulesf
          key: ${{ runner.os }}-node-${{ hashFiles('crates/oidc-ui/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Create .env file for frontend
        working-directory: crates/oidc-ui/frontend
        env:
          PUBLIC_OS_OIDC_API_URL: "http://localhost:3000/oidc/api"
          PUBLIC_URL: "http://localhost:5173/oidc"
          VITE_BASE_PATH: "/oidc"
        run: |
          echo "PUBLIC_OS_OIDC_API_URL=${PUBLIC_OS_OIDC_API_URL}" > .env
          echo "PUBLIC_URL=${PUBLIC_URL}" >> .env
          echo "VITE_BASE_PATH=${VITE_BASE_PATH}" >> .env
      - name: Install frontend dependencies
        working-directory: crates/oidc-ui/frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: crates/oidc-ui/frontend
        run: pnpm build
      - name: Run tests
        run: cargo test --all --verbose
