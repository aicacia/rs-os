name: Build Images

env:
  RUST_IMAGE_DEFAULT: rust:1.92-trixie
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  build-individual:
    name: Build service images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - os-oidc
          - os-oidc-admin
          - os-signaling
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/386
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.project }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=${{ matrix.project }}
            RUST_IMAGE=${{ env.RUST_IMAGE_DEFAULT }}

      - name: Save image to tar
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }} -o ${{ matrix.project }}-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-${{ steps.prep.outputs.platform_tag }}
          path: ${{ matrix.project }}-${{ steps.prep.outputs.platform_tag }}.tar
          retention-days: 1

  manifest-individual:
    name: Create service manifests
    needs: build-individual
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - os-oidc
          - os-oidc-admin
          - os-signaling
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare short SHA
        id: prep
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.project }}-linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.project }}-linux-arm64

      - name: Download linux-arm-v7 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.project }}-linux-arm-v7

      - name: Load images
        run: |
          docker load -i ${{ matrix.project }}-linux-amd64.tar
          docker load -i ${{ matrix.project }}-linux-arm64.tar
          docker load -i ${{ matrix.project }}-linux-arm-v7.tar

      - name: Push images to registry
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-amd64
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-arm64
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-arm-v7

      - name: Create and push manifest for ${{ matrix.project }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }} \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:latest \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-arm64 \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ steps.prep.outputs.short_sha }}-linux-arm-v7

  build-base-ui:
    name: Build base UI image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build base UI image (os-ui) for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: os-ui-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=os-ui
            RUST_IMAGE=${{ env.RUST_IMAGE_DEFAULT }}

      - name: Save base UI image to tar
        run: |
          docker save os-ui-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }} -o os-ui-base-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Upload base UI image artifact
        uses: actions/upload-artifact@v6
        with:
          name: os-ui-base-${{ steps.prep.outputs.platform_tag }}
          path: os-ui-base-${{ steps.prep.outputs.platform_tag }}.tar
          retention-days: 1

  build-ui:
    name: Build UI images
    needs: build-base-ui
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - oidc
          - oidc-admin
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download base UI image artifact
        uses: actions/download-artifact@v7
        with:
          name: os-ui-base-${{ steps.prep.outputs.platform_tag }}

      - name: Load base UI image
        run: |
          docker load -i os-ui-base-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Build os-${{ matrix.project }}-ui for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=${{ matrix.project }}
            BASE=os-ui-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
            RUST_IMAGE=${{ env.RUST_IMAGE_DEFAULT }}

      - name: Save project UI image to tar
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }} -o os-${{ matrix.project }}-ui-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Upload project UI image artifact
        uses: actions/upload-artifact@v6
        with:
          name: os-${{ matrix.project }}-ui-${{ steps.prep.outputs.platform_tag }}
          path: os-${{ matrix.project }}-ui-${{ steps.prep.outputs.platform_tag }}.tar
          retention-days: 1

  manifest-ui:
    name: Create UI manifests
    needs: build-ui
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - oidc
          - oidc-admin
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare short SHA
        id: prep
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download project UI linux-amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-${{ matrix.project }}-ui-linux-amd64

      - name: Download project UI linux-arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-${{ matrix.project }}-ui-linux-arm64

      - name: Download project UI linux-arm-v7 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-${{ matrix.project }}-ui-linux-arm-v7

      - name: Load images
        run: |
          docker load -i os-${{ matrix.project }}-ui-linux-amd64.tar
          docker load -i os-${{ matrix.project }}-ui-linux-arm64.tar
          docker load -i os-${{ matrix.project }}-ui-linux-arm-v7.tar

      - name: Push project UI images to registry
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-amd64
          docker push ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-arm64
          docker push ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-arm-v7

      - name: Create and push manifest for os-${{ matrix.project }}-ui
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }} \
            -t ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:latest \
            ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-arm64 \
            ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ steps.prep.outputs.short_sha }}-linux-arm-v7

  build-unified:
    name: Build unified image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/386
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build unified base os image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: os-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=os
            RUST_IMAGE=${{ env.RUST_IMAGE_DEFAULT }}

      - name: Save base image to tar
        run: |
          docker save os-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }} -o os-base-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Build unified image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.unified
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            BASE=os-base:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }}

      - name: Save image to tar
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-${{ steps.prep.outputs.platform_tag }} -o os-${{ steps.prep.outputs.platform_tag }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: os-${{ steps.prep.outputs.platform_tag }}
          path: os-${{ steps.prep.outputs.platform_tag }}.tar
          retention-days: 1

  manifest-unified:
    name: Create unified manifest
    needs: build-unified
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare short SHA
        id: prep
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-linux-arm64

      - name: Download linux-arm-v7 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-linux-arm-v7

      - name: Download linux-386 artifact
        uses: actions/download-artifact@v7
        with:
          name: os-linux-386

      - name: Load images
        run: |
          docker load -i os-linux-amd64.tar
          docker load -i os-linux-arm64.tar
          docker load -i os-linux-arm-v7.tar
          docker load -i os-linux-386.tar

      - name: Push images to registry
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-amd64
          docker push ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-arm64
          docker push ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-arm-v7
          docker push ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-386

      - name: Create and push manifest for os
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }} \
            -t ghcr.io/${{ github.repository_owner }}/os:latest \
            ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-amd64 \
            ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-arm64 \
            ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-arm-v7 \
            ghcr.io/${{ github.repository_owner }}/os:${{ steps.prep.outputs.short_sha }}-linux-386
