name: Build Images

env:
  RUST_IMAGE_DEFAULT: rust:1.92-trixie

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  build-individual:
    name: Build service images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - os-oidc
          - os-oidc-admin
          - os-signaling
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/riscv64
          - linux/ppc64le
          - linux/386
        include:
          - platform: linux/ppc64le
            rust_image: messense/rust-musl-cross:powerpc64le-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.project }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=${{ matrix.project }}
            RUST_IMAGE=${{ matrix.rust_image || env.RUST_IMAGE_DEFAULT }}

  manifest-individual:
    name: Create service manifests
    needs: build-individual
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - os-oidc
          - os-oidc-admin
          - os-signaling
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest for ${{ matrix.project }}
        run: |
          docker manifest create ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }} \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-amd64 \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-arm64 \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-arm-v7 \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-riscv64 \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-ppc64le \
            --amend ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}-linux-386
          docker manifest push ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}:${{ github.sha }}

      - name: Delete individual platform images
        if: always()
        run: |
          for platform in linux-amd64 linux-arm64 linux-arm-v7 linux-riscv64 linux-ppc64le linux-386; do
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/${{ matrix.project }}/manifests/${{ github.sha }}-${platform}" || true
          done

  build-ui:
    name: Build UI images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - oidc
          - oidc-admin
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/riscv64
          - linux/ppc64le
          - linux/386
        include:
          - platform: linux/ppc64le
            rust_image: messense/rust-musl-cross:powerpc64le-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

      - name: Build base UI image (os-ui) for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/os-ui:${{ github.sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=os-ui
            RUST_IMAGE=${{ matrix.rust_image || env.RUST_IMAGE_DEFAULT }}

      - name: Build os-${{ matrix.project }}-ui for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=${{ matrix.project }}
            BASE=ghcr.io/${{ github.repository_owner }}/os-ui:${{ github.sha }}-${{ steps.prep.outputs.platform_tag }}
            RUST_IMAGE=${{ matrix.rust_image || env.RUST_IMAGE_DEFAULT }}

  manifest-ui:
    name: Create UI manifests
    needs: build-ui
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - oidc
          - oidc-admin
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest for os-${{ matrix.project }}-ui
        run: |
          docker manifest create ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }} \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-amd64 \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-arm64 \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-arm-v7 \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-riscv64 \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-ppc64le \
            --amend ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}-linux-386
          docker manifest push ghcr.io/${{ github.repository_owner }}/os-${{ matrix.project }}-ui:${{ github.sha }}

      - name: Delete individual platform images
        if: always()
        run: |
          for platform in linux-amd64 linux-arm64 linux-arm-v7 linux-riscv64 linux-ppc64le linux-386; do
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/os-${{ matrix.project }}-ui/manifests/${{ github.sha }}-${platform}" || true
          done

  build-unified:
    name: Build unified image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/riscv64
          - linux/ppc64le
          - linux/386
        include:
          - platform: linux/ppc64le
            rust_image: messense/rust-musl-cross:powerpc64le-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=${PLATFORM_TAG}" >> $GITHUB_OUTPUT

      - name: Build unified image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-${{ steps.prep.outputs.platform_tag }}
          build-args: |
            PROJECT=os
            RUST_IMAGE=${{ matrix.rust_image || env.RUST_IMAGE_DEFAULT }}

  manifest-unified:
    name: Create unified manifest
    needs: build-unified
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest for os
        run: |
          docker manifest create ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }} \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-amd64 \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-arm64 \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-arm-v7 \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-riscv64 \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-ppc64le \
            --amend ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}-linux-386
          docker manifest push ghcr.io/${{ github.repository_owner }}/os:${{ github.sha }}

      - name: Delete individual platform images
        if: always()
        run: |
          for platform in linux-amd64 linux-arm64 linux-arm-v7 linux-riscv64 linux-ppc64le linux-386; do
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/os/manifests/${{ github.sha }}-${platform}" || true
          done

  delete-old-versions:
    name: Delete untagged images
    needs:
      - manifest-individual
      - manifest-ui
      - manifest-unified
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - os-oidc
          - os-oidc-admin
          - os-signaling
          - os-oidc-ui
          - os-oidc-admin-ui
          - os
    steps:
      - name: Delete untagged versions for ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
