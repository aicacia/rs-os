[package]
name = "os"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-os"
rust-version = "1.92"
default-run = "os"

[[bin]]
name = "os"

[lib]
name = "os"

[workspace]
members = [
  "crates/api",
  "crates/cli",
  "crates/fs",
  "crates/oidc",
  "crates/oidc-admin",
  "crates/oidc-model",
  "crates/service-discovery",
  "crates/signaling",
  "crates/ui",
]

[dependencies]
axum = { version = "0.8", features = [
  "tokio",
  "http1",
  "json",
  "query",
  "macros",
], default-features = false }
clap = { version = "4.5", features = [
  "std",
  "derive",
  "help",
], default-features = false }
clap_complete = { version = "4.5", optional = true, default-features = false }
config = { version = "0.15", features = ["json"], default-features = false }
dotenvy = { version = "0.15", default-features = false }
log = { version = "0.4", default-features = false }
os-api = { version = "0.1", path = "./crates/api", default-features = false }
os-cli = { version = "0.1", path = "./crates/cli", default-features = false }
os-fs = { version = "0.1", path = "./crates/fs", default-features = false }
os-oidc = { version = "0.1", path = "./crates/oidc", default-features = false }
os-oidc-admin = { version = "0.1", path = "./crates/oidc-admin", default-features = false }
os-oidc-model = { version = "0.1", path = "./crates/oidc-model", default-features = false }
os-service-discovery = { version = "0.1", path = "./crates/service-discovery", default-features = false }
os-signaling = { version = "0.1", path = "./crates/signaling", default-features = false }
os-ui = { version = "0.1", path = "./crates/ui", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
tokio = { version = "1.48", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
], default-features = false }
tokio-util = { version = "0.7", features = ["io"], default-features = false }
tower-http = { version = "0.6", features = [
  "cors",
  "trace",
  "compression-gzip",
], default-features = false }
tracing = { version = "0.1", features = ["std"], default-features = false }
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "fmt",
  "std",
  "tracing-log",
  "env-filter",
], default-features = false }

[features]
completions = ["dep:clap_complete"]
default = ["completions"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
# Security and correctness
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
panic = "warn"

# Performance
clone_on_copy = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"

# Style
missing_docs = "warn"
dbg_macro = "warn"
print_stdout = "warn"
