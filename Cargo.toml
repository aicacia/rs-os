[package]
name = "os"
edition = "2024"
version = "0.1.0"
authors = ["nathanfaucett@gmail.com"]
description = "Aicacia OS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicacia/rs-os"
rust-version = "1.91"
default-run = "os"

[workspace]
members = [
  "crates/db",
  "crates/oidc",
  "crates/oidc-ui/embed",
  "crates/oidc-ui",
  "crates/cli",
  "crates/document-store",
  "crates/fs",
]

[dependencies]
axum = { version = "0.8", features = [
  "tokio",
  "http1",
  "json",
  "query",
  "macros",
], default-features = false }
clap = { version = "4.5", features = [
  "std",
  "derive",
  "help",
], default-features = false }
clap_complete = { version = "4.5", optional = true, default-features = false }
config = { version = "0.15", features = ["json"], default-features = false }
dotenvy = { version = "0.15", default-features = false }
log = { version = "0.4", default-features = false }
os-cli = { version = "0.1", path = "./crates/cli", default-features = false }
os-db = { version = "0.1", path = "./crates/db", default-features = false }
os-oidc = { version = "0.1", path = "./crates/oidc", default-features = false }
os-oidc-ui = { version = "0.1", path = "./crates/oidc-ui", default-features = false, optional = true }
os-oidc-ui-embed = { version = "0.1", path = "./crates/oidc-ui/embed", default-features = false }
os-document-store = { version = "0.1", path = "./crates/document-store", default-features = false }
os-fs = { version = "0.1", path = "./crates/fs", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
sqlx = { version = "0.8", features = [
  "uuid",
  "chrono",
  "time",
  "macros",
  "migrate",
  "runtime-tokio-rustls",
  "all-databases",
], default-features = false }
tokio = { version = "1.47", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
], default-features = false }
tokio-util = { version = "0.7", features = ["io"], default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false }
tracing = { version = "0.1", features = ["std"], default-features = false }
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "fmt",
  "std",
  "tracing-log",
  "env-filter",
], default-features = false }

[features]
completions = ["dep:clap_complete"]
default = ["completions"]

[[bin]]
name = "os"

[lib]
name = "os"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
